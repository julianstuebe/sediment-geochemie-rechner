<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>if (sessionStorage.getItem("sgc-unlocked") === "1") { document.documentElement.classList.add("unlocked"); }</script>
  <title>Sediment-Geochemie Rechner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="gate">
    <form id="gate-form" class="gate-box">
      <h1>Sediment-Geochemie Rechner</h1>
      <p class="gate-hint">Diese Seite ist passwortgeschützt. Bitte Passwort eingeben.</p>
      <input type="password" id="gate-password" autocomplete="current-password" placeholder="Passwort">
      <button type="submit">Anmelden</button>
      <p class="gate-error" id="gate-error" hidden>Falsches Passwort.</p>
    </form>
  </div>
  <header class="site-header">
    <h1>Sediment-Geochemie Rechner</h1>
    <p class="subtitle">Werte eingeben, Formeln rechnen lassen — stück für stück erweiterbar</p>
  </header>
  <main id="app"></main>
  <footer class="site-footer">
    <p>Sediment-Geochemie Rechner</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
